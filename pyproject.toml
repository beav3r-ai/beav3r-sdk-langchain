[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beav3r-sdk-langchain"
version = "1.0.0"
description = "LangChain middleware for routing sensitive tool calls through Beav3r approvals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Beav3r" }
]
dependencies = [
  "beav3r-sdk>=2.0.0",
  "langchain>=1.0.0",
  "langgraph>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/beav3r-ai/beav3r-sdk-langchain"
Source = "https://github.com/beav3r-ai/beav3r-sdk-langchain"
Issues = "https://github.com/beav3r-ai/beav3r-sdk-langchain/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
